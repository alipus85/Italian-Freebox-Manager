name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore Keystore
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > ~/.android/debug.keystore
          elif [ -f "debug.keystore.base64" ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > ~/.android/debug.keystore
          elif [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
          fi
          echo "Keystore configurato con impronta:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "SHA256:" || true

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/*.apk release_apk/ItalianFreeboxManager.apk
          echo "APK preparato con successo:"
          ls -la release_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ItalianFreeboxManager-APK
          path: release_apk/ItalianFreeboxManager.apk
          retention-days: 14

      - name: Release APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Italian Freebox Manager (Latest)"
          body: "Aggiornamento automatico generato da GitHub Actions (Build #${{ github.run_number }})."
          draft: false
          prerelease: false
          files: release_apk/ItalianFreeboxManager.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
